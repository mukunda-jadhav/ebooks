<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Library — ReadVault</title><link rel="icon" type="image/png" href="/logo.png">
  <script>{const theme=localStorage.getItem('readvault-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme;document.documentElement.dataset.bsTheme=theme}</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/theme.css" rel="stylesheet">
  <style>:root{--brand:#7657ff}.brand-logo{width:64px;height:42px;object-fit:contain;border-radius:10px;background:#030712}.shell{min-height:calc(100dvh - 70px);padding:4rem 0}.auth-card{max-width:500px;margin:auto;border:1px solid var(--rv-border);border-radius:1.5rem;box-shadow:0 20px 55px var(--rv-shadow)}.divider{display:flex;align-items:center;gap:1rem;color:var(--rv-muted);margin:1.25rem 0}.divider:before,.divider:after{content:"";height:1px;background:var(--rv-border);flex:1}.google-btn{display:flex;align-items:center;justify-content:center;gap:.75rem}.google-mark{width:20px;height:20px}.book-cover{width:80px;height:105px;border-radius:.7rem;object-fit:cover;background:#6d4aff}.library-item{border:1px solid var(--rv-border);border-radius:1.2rem;background:var(--rv-surface);min-width:0}.library-item>div{min-width:0}button,a.btn{min-height:44px}</style>
</head>
<body>
  <nav class="navbar border-bottom"><div class="container py-2"><a class="navbar-brand fw-bold d-flex gap-2 align-items-center" href="/"><img class="brand-logo" src="/logo.png" alt="ReadVault logo"> ReadVault</a><button class="theme-toggle" data-theme-toggle type="button" aria-label="Use dark mode"></button></div></nav>
  <main class="container shell"><div id="message" tabindex="-1"></div>
    <section id="auth" class="auth-card panel p-4 p-sm-5 d-none"><h1 class="h2 fw-bold">Your books, always available</h1><p class="text-secondary">Sign in with Google or your verified email.</p><button id="google" class="btn btn-outline-secondary google-btn w-100 rounded-pill" type="button"><svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.6h3.3c1.9-1.8 2.9-4.4 2.9-7.5z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.3l-3.3-2.6c-.9.6-2.1 1-3.4 1a5.9 5.9 0 0 1-5.5-4.1H3.1v2.7A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.5 14a6 6 0 0 1 0-4V7.3H3.1a10 10 0 0 0 0 9.4L6.5 14z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.9 1.5l2.9-2.9A9.7 9.7 0 0 0 3.1 7.3L6.5 10A5.9 5.9 0 0 1 12 5.9z"/></svg>Continue with Google</button><div class="divider">or</div>
      <div class="d-flex gap-2 mb-4" role="tablist"><button id="loginTab" class="btn btn-brand flex-fill" type="button" role="tab" aria-selected="true">Sign in</button><button id="registerTab" class="btn btn-outline-secondary flex-fill" type="button" role="tab" aria-selected="false">Create account</button></div>
      <form id="authForm"><div id="nameGroup" class="mb-3 d-none"><label class="form-label fw-semibold" for="name">Name</label><input id="name" name="name" maxlength="80" autocomplete="name" class="form-control"></div><div class="mb-3"><label class="form-label fw-semibold" for="email">Email</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" class="form-control" required></div><div class="mb-3"><label class="form-label fw-semibold" for="password">Password</label><input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" class="form-control" required><div class="d-flex align-items-center justify-content-between"><span class="form-text">At least 8 characters.</span><button id="showPassword" class="btn btn-link py-0" type="button" aria-pressed="false">Show password</button></div></div><button id="submit" class="btn btn-brand w-100 rounded-pill" type="submit">Sign in</button></form>
      <div class="d-flex flex-wrap justify-content-center gap-3 mt-3"><button id="forgot" class="btn btn-link p-0" type="button">Forgot password?</button><button id="resend" class="btn btn-link p-0" type="button">Resend verification</button></div>
    </section>
    <section id="library" class="d-none"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><p class="text-primary fw-bold mb-1">MY LIBRARY</p><h1 class="fw-bold mb-1">Welcome, <span id="userName"></span></h1><p class="text-secondary mb-0">Download any ebook you have purchased.</p></div><button id="logout" class="btn btn-outline-secondary rounded-pill px-4">Sign out</button></div><div id="books" class="row g-3"></div></section>
  </main>
  <script src="/theme.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script>
    const authSection=document.getElementById('auth'),library=document.getElementById('library'),form=document.getElementById('authForm'),message=document.getElementById('message');let mode='login',firebaseReady;
    function esc(value){const el=document.createElement('div');el.textContent=String(value);return el.innerHTML}function showMessage(text,type='danger'){message.innerHTML=`<div class="alert alert-${type}" role="alert">${esc(text)}</div>`;message.focus()}async function json(response){const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed');return data}
    function setMode(next){mode=next;const register=next==='register';document.getElementById('nameGroup').classList.toggle('d-none',!register);form.name.required=register;form.password.autocomplete=register?'new-password':'current-password';document.getElementById('submit').textContent=register?'Create account':'Sign in';document.getElementById('forgot').classList.toggle('d-none',register);document.getElementById('resend').classList.toggle('d-none',register);for(const [id,active] of [['loginTab',!register],['registerTab',register]]){const tab=document.getElementById(id);tab.className=`btn flex-fill ${active?'btn-brand':'btn-outline-secondary'}`;tab.setAttribute('aria-selected',String(active))}message.innerHTML=''}
    function cover(book){return /^(https?:\/\/|\/)/.test(book.cover)?`<img class="book-cover" src="${esc(book.cover)}" alt="Cover of ${esc(book.title)}">`:`<div class="book-cover" style="background:${esc(book.cover)}" role="img" aria-label="Cover of ${esc(book.title)}"></div>`}
    async function load(){try{const data=await json(await fetch('/api/library'));authSection.classList.add('d-none');library.classList.remove('d-none');document.getElementById('userName').textContent=data.user.name;document.getElementById('books').innerHTML=data.books.length?data.books.map(book=>`<div class="col-lg-6"><article class="library-item h-100 p-3 d-flex gap-3">${cover(book)}<div class="flex-grow-1"><div class="small text-primary fw-bold">${esc(book.category)}</div><h2 class="h5 fw-bold">${esc(book.title)}</h2><div class="text-secondary small mb-3">By ${esc(book.author)}</div><a class="btn btn-brand rounded-pill px-4" href="/api/library/${encodeURIComponent(book.id)}/download">Download again</a></div></article></div>`).join(''):'<div class="col-12"><div class="panel text-center p-5 rounded-4"><h2 class="h4">No purchased books yet</h2><p class="text-secondary">Your ebooks will appear here after checkout.</p><a class="btn btn-brand rounded-pill px-4" href="/">Browse ebooks</a></div></div>'}catch{library.classList.add('d-none');authSection.classList.remove('d-none')}}
    async function finish(){const next=new URLSearchParams(location.search).get('next');if(next&&next.startsWith('/')&&!next.startsWith('//'))location.href=next;else await load()}
    async function initFirebase(){const config=await json(await fetch('/api/auth/firebase-config'));if(!config)throw new Error('Firebase Authentication is not configured.');if(!firebase.apps.length)firebase.initializeApp(config);firebaseReady=firebase.auth()}
    document.getElementById('loginTab').onclick=()=>setMode('login');document.getElementById('registerTab').onclick=()=>setMode('register');document.getElementById('showPassword').onclick=event=>{const visible=form.password.type==='text';form.password.type=visible?'password':'text';event.currentTarget.textContent=visible?'Show password':'Hide password';event.currentTarget.setAttribute('aria-pressed',String(!visible))};
    form.addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit');button.disabled=true;button.textContent=mode==='register'?'Creating account…':'Signing in…';try{const endpoint=mode==='register'?'register':'login',payload={name:form.name.value,email:form.email.value,password:form.password.value},data=await json(await fetch(`/api/auth/${endpoint}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}));if(mode==='register'){form.reset();setMode('login');showMessage(data.message,'success')}else await finish()}catch(error){showMessage(error.message)}finally{button.disabled=false;button.textContent=mode==='register'?'Create account':'Sign in'}});
    document.getElementById('google').onclick=async()=>{const button=document.getElementById('google');button.disabled=true;try{if(!firebaseReady)await initFirebase();const result=await firebaseReady.signInWithPopup(new firebase.auth.GoogleAuthProvider()),idToken=await result.user.getIdToken();await json(await fetch('/api/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken})}));await firebaseReady.signOut();await finish()}catch(error){showMessage(error.message||'Google sign-in failed')}finally{button.disabled=false}};
    document.getElementById('forgot').onclick=async()=>{if(!form.email.reportValidity())return;try{const data=await json(await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value})}));showMessage(data.message,'success')}catch(error){showMessage(error.message)}};
    document.getElementById('resend').onclick=async()=>{if(!form.reportValidity())return;try{const data=await json(await fetch('/api/auth/resend-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value,password:form.password.value})}));showMessage(data.message,'success')}catch(error){showMessage(error.message)}};
    document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.reload()};load();
  </script>
</body></html>
