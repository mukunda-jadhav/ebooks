<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Book details — ReadVault</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--ink:#172033;--brand:#6d4aff;--paper:#f7f8fc}body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}.navbar{background:#fff}.brand-mark{width:32px;height:32px;display:inline-grid;place-items:center;background:var(--brand);color:#fff;border-radius:10px}.page{padding:5rem 0}.cover{aspect-ratio:3/4;max-width:430px;border-radius:1.5rem;padding:2.3rem;display:flex;align-items:flex-end;color:#fff;box-shadow:0 25px 60px rgba(30,41,59,.2);position:relative}.cover:before{content:'';position:absolute;inset:24px;border:1px solid rgba(255,255,255,.4);border-radius:1rem}.cover span{font-size:clamp(2rem,4vw,3.2rem);font-weight:800;line-height:1.05;position:relative}.eyebrow{color:var(--brand);font-weight:700;letter-spacing:.12em;font-size:.78rem}.title{font-size:clamp(2.5rem,6vw,4.5rem);letter-spacing:-.045em;line-height:1.02}.price{font-size:2rem;font-weight:800}.feature{background:#fff;border:1px solid #e7eaf2;border-radius:1rem;padding:1rem}.check{color:#16a34a;font-weight:900}.btn-brand{background:var(--brand);border-color:var(--brand);color:#fff}.btn-brand:hover{background:#5536db;border-color:#5536db;color:#fff}.spinner-area{min-height:55vh;display:grid;place-items:center}@media(max-width:991px){.page{padding-top:2.5rem}.cover{margin:auto;max-width:340px}.details{margin-top:3rem}}
  .brand-logo{width:64px;height:42px;object-fit:contain;border-radius:10px;background:#030712;box-shadow:0 3px 12px rgba(30,41,59,.18)}
  .book-meta{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.meta-pill{background:#ece8ff;color:#5638d8;border-radius:999px;padding:.35rem .75rem;font-weight:700;font-size:.8rem}.share-status{min-height:1.5rem}
  </style>
</head>
<body>
  <nav class="navbar border-bottom"><div class="container py-2"><a class="navbar-brand fw-bold d-flex gap-2 align-items-center" href="/"><img class="brand-logo" src="/logo.png" alt="ReadVault logo"> ReadVault</a></div></nav>
  <main class="container page"><div id="alert"></div><div id="loading" class="spinner-area"><div class="text-center"><div class="spinner-border text-primary" role="status"></div><p class="text-secondary mt-3">Opening your book…</p></div></div><div id="content" class="row align-items-center g-5 d-none"><div class="col-lg-5"><div id="cover" class="cover"><span id="coverTitle"></span></div></div><div class="col-lg-7 details"><div class="eyebrow mb-3">READVAULT EDITION</div><h1 id="title" class="title fw-bold"></h1><p id="description" class="lead text-secondary my-4"></p><div id="features" class="row g-3 mb-4"></div><div class="d-flex flex-wrap gap-3 align-items-center pt-2"><span id="price" class="price me-3"></span><button id="buy" class="btn btn-brand btn-lg rounded-pill px-5">Buy Ebook</button><a href="/" class="btn btn-outline-secondary btn-lg rounded-pill px-4">Back to library</a></div><p class="small text-secondary mt-3">Secure checkout · One-time private download</p></div></div></main>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const params=new URLSearchParams(location.search),bookId=params.get('id')||location.pathname.split('/').filter(Boolean).pop(),alertEl=document.getElementById('alert'),buy=document.getElementById('buy');let book;
    document.getElementById('title').insertAdjacentHTML('beforebegin','<div class="book-meta mb-3"><span id="category" class="meta-pill"></span><span id="author" class="text-secondary"></span></div>');
    document.querySelector('a[href="/"]').insertAdjacentHTML('beforebegin','<button id="share" class="btn btn-outline-primary btn-lg rounded-pill px-4" type="button">Share</button>');
    document.querySelector('.details .small.text-secondary').insertAdjacentHTML('beforebegin','<p id="shareStatus" class="share-status small text-success mt-3 mb-0" role="status" aria-live="polite"></p>');
    const money=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
    function escapeHtml(value){const d=document.createElement('div');d.textContent=String(value);return d.innerHTML}
    function showError(message){alertEl.innerHTML=`<div class="alert alert-danger">${escapeHtml(message)}</div>`}
    async function json(response){const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'Something went wrong');return body}
    async function loadBook(){if(!bookId){document.getElementById('loading').classList.add('d-none');showError('No book was selected. Return to the library and choose a book.');return}try{book=await json(await fetch(`/api/books/${encodeURIComponent(bookId)}`));document.title=`${book.title} — ReadVault`;const cover=document.getElementById('cover');if(/^(https?:\/\/|\/)/.test(book.cover)){cover.style.background=`url('${encodeURI(book.cover)}') center/cover`;document.getElementById('coverTitle').textContent=''}else{cover.style.background=book.cover;document.getElementById('coverTitle').textContent=book.title}document.getElementById('title').textContent=book.title;document.getElementById('description').textContent=book.description;document.getElementById('price').textContent=money.format(book.price);document.getElementById('features').innerHTML=book.features.map(item=>`<div class="col-sm-6"><div class="feature h-100"><span class="check me-2">✓</span>${escapeHtml(item)}</div></div>`).join('');document.getElementById('loading').classList.add('d-none');document.getElementById('content').classList.remove('d-none')}catch(error){document.getElementById('loading').classList.add('d-none');showError(error.message)}}
    document.getElementById('share').addEventListener('click',async()=>{const status=document.getElementById('shareStatus'),data={title:book.title,text:`${book.title} by ${book.author||'ReadVault'}`,url:location.href};try{if(navigator.share){await navigator.share(data);status.textContent='Shared successfully.'}else{await navigator.clipboard.writeText(location.href);status.textContent='Book link copied.'}}catch(error){if(error.name!=='AbortError')status.textContent='Could not share automatically. Copy the URL from your browser.'}});
    buy.addEventListener('click',async()=>{buy.disabled=true;buy.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Preparing checkout';alertEl.innerHTML='';try{const order=await json(await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookId:book.id})}));const options={key:order.keyId,amount:order.amount,currency:order.currency,name:'ReadVault',description:book.title,order_id:order.orderId,theme:{color:'#6d4aff'},handler:async payment=>{buy.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Verifying payment';try{const result=await json(await fetch('/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookId:book.id,razorpay_order_id:payment.razorpay_order_id,razorpay_payment_id:payment.razorpay_payment_id,razorpay_signature:payment.razorpay_signature})}));alertEl.innerHTML='<div class="alert alert-success">Payment verified. Preparing your secure download…</div>';location.href=`/download.html?token=${encodeURIComponent(result.downloadToken)}`}catch(error){showError(error.message);buy.disabled=false;buy.textContent='Try verification again'}},modal:{ondismiss:()=>{buy.disabled=false;buy.textContent='Buy Ebook'}}};const checkout=new Razorpay(options);checkout.on('payment.failed',response=>{showError(response.error.description||'Payment failed. Please try again.');buy.disabled=false;buy.textContent='Buy Ebook'});checkout.open()}catch(error){showError(error.message);buy.disabled=false;buy.textContent='Buy Ebook'}});
    loadBook().then(()=>{if(book){document.getElementById('author').textContent=`By ${book.author||'ReadVault'}`;document.getElementById('category').textContent=book.category||'General'}});
  </script>
</body>
</html>
