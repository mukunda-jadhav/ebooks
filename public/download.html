<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Secure download — ReadVault</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--brand:#6d4aff;--ink:#172033}body{font-family:Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(circle at 20% 0,#e0e7ff 0,transparent 35%),#f7f8fc}.brand-mark{width:32px;height:32px;display:inline-grid;place-items:center;background:var(--brand);color:#fff;border-radius:10px}.shell{min-height:calc(100vh - 66px);display:grid;place-items:center;padding:3rem 1rem}.panel{max-width:650px;width:100%;background:#fff;border-radius:1.5rem;padding:clamp(2rem,6vw,4rem);box-shadow:0 25px 70px rgba(30,41,59,.12)}.icon{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#dcfce7;color:#15803d;font-size:2rem;font-weight:900}.icon.error{background:#fee2e2;color:#b91c1c}.btn-brand{background:var(--brand);border-color:var(--brand);color:#fff}.btn-brand:hover{background:#5536db;border-color:#5536db;color:#fff}.notice{background:#f8fafc;border-radius:1rem;padding:1rem;color:#64748b}
  .brand-logo{width:64px;height:42px;object-fit:contain;border-radius:10px;background:#030712;box-shadow:0 3px 12px rgba(30,41,59,.18)}
  </style>
</head>
<body>
  <nav class="navbar bg-white border-bottom"><div class="container py-2"><a class="navbar-brand fw-bold d-flex gap-2 align-items-center" href="/"><img class="brand-logo" src="/logo.png" alt="ReadVault logo"> ReadVault</a></div></nav>
  <main class="shell"><section class="panel text-center"><div id="loading"><div class="spinner-border text-primary" role="status"></div><p class="text-secondary mt-3 mb-0">Validating your secure link…</p></div><div id="valid" class="d-none"><div class="icon">✓</div><p class="text-success fw-bold mt-4 mb-2">PAYMENT VERIFIED</p><h1 class="h2 fw-bold">Your ebook is ready</h1><p id="bookTitle" class="lead text-secondary mb-4"></p><button id="download" class="btn btn-brand btn-lg rounded-pill px-5">Download Ebook</button><div class="notice small mt-4">This private link works once and expires after 30 minutes. Your browser will save the PDF directly.</div></div><div id="invalid" class="d-none"><div class="icon error">!</div><h1 class="h2 fw-bold mt-4">Download unavailable</h1><p id="errorText" class="text-secondary"></p><a href="/" class="btn btn-outline-secondary rounded-pill px-4 mt-2">Return to library</a></div></section></main>
  <script>
    const token=new URLSearchParams(location.search).get('token'),loading=document.getElementById('loading'),valid=document.getElementById('valid'),invalid=document.getElementById('invalid'),button=document.getElementById('download');
    function fail(message){loading.classList.add('d-none');valid.classList.add('d-none');invalid.classList.remove('d-none');document.getElementById('errorText').textContent=message}
    async function check(){if(!token)return fail('A valid payment download token is required.');try{const response=await fetch(`/api/download-status?token=${encodeURIComponent(token)}`),body=await response.json().catch(()=>({}));if(!response.ok||!body.valid)throw new Error(body.error||'This download link is invalid.');document.getElementById('bookTitle').textContent=body.bookTitle;loading.classList.add('d-none');valid.classList.remove('d-none')}catch(error){fail(error.message)}}
    button.addEventListener('click',async()=>{button.disabled=true;button.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>Starting download';try{const response=await fetch(`/api/download?token=${encodeURIComponent(token)}`,{method:'POST'});if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.error||'Download could not be started.')}const blob=await response.blob(),disposition=response.headers.get('content-disposition')||'',match=disposition.match(/filename="?([^";]+)"?/i),filename=match?match[1]:'ebook.pdf',url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);button.textContent='Download completed';document.querySelector('.notice').textContent='This one-time link has now been used. Keep your downloaded file safe.'}catch(error){fail(error.message)}});
    check();
  </script>
</body>
</html>
