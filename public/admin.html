<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — ReadVault</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <script>{const theme=localStorage.getItem('readvault-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme;document.documentElement.dataset.bsTheme=theme}</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/theme.css" rel="stylesheet">
  <style>
    :root{--brand:#6d4aff;--ink:#172033;--paper:#f6f7fb}body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink)}.sidebar{background:#17152b;color:#fff;min-height:100vh}.brand-mark{width:36px;height:36px;display:grid;place-items:center;background:var(--brand);border-radius:11px}.panel{background:#fff;border:1px solid #e8eaf1;border-radius:1.25rem;box-shadow:0 8px 28px rgba(30,41,59,.06)}.form-control{border-radius:.8rem;padding:.72rem .9rem}.btn-brand{background:var(--brand);border-color:var(--brand);color:#fff}.btn-brand:hover{background:#5638d8;color:#fff}.book-thumb{width:58px;height:76px;border-radius:.55rem;object-fit:cover;background:#ddd}.drop{border:2px dashed #d7d9e5;border-radius:1rem;padding:1rem;background:#fafaff}.login-wrap{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,#ddd6fe,transparent 35%),var(--paper)}@media(max-width:767px){.sidebar{min-height:auto}.table-books thead{display:none}.table-books tr{display:block;padding:1rem}.table-books td{display:block;border:0;padding:.25rem}.table-books td:last-child{margin-top:.6rem}}
  .brand-logo{width:64px;height:42px;object-fit:contain;border-radius:10px;background:#030712;box-shadow:0 3px 12px rgba(30,41,59,.18)}
  </style>
</head>
<body>
  <section id="login" class="login-wrap d-none"><form id="loginForm" class="panel p-4 p-sm-5" style="width:min(92vw,430px)"><img class="brand-logo mb-4" src="/logo.png" alt="ReadVault logo"><h1 class="h3 fw-bold">Admin sign in</h1><p class="text-secondary">Manage your ebook library securely.</p><div id="loginAlert"></div><label class="form-label fw-semibold mt-2">Admin password</label><input id="password" type="password" class="form-control mb-3" required autofocus><button class="btn btn-brand w-100 py-2 rounded-pill" type="submit">Sign in</button><a href="/" class="d-block text-center mt-3 text-secondary">Back to store</a></form></section>
  <div id="dashboard" class="container-fluid d-none"><div class="row"><aside class="col-md-3 col-xl-2 sidebar p-4"><div class="d-flex align-items-center gap-2 fw-bold fs-5"><img class="brand-logo" src="/logo.png" alt="ReadVault logo"> ReadVault</div><p class="text-white-50 small mt-4">STORE ADMIN</p><div class="fw-semibold">Ebook library</div><button id="logout" class="btn btn-outline-light btn-sm mt-4">Sign out</button></aside><main class="col-md-9 col-xl-10 p-3 p-lg-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 fw-bold mb-1">Your ebooks</h1><p class="text-secondary mb-0">Upload, price, and publish books in one place.</p></div><button id="newBook" class="btn btn-brand rounded-pill px-4">+ Add ebook</button></div><div id="alert"></div><section id="editor" class="panel p-4 mb-4 d-none"><div class="d-flex justify-content-between"><h2 id="formTitle" class="h4 fw-bold">Add a new ebook</h2><button id="closeEditor" class="btn-close" type="button"></button></div><form id="bookForm" enctype="multipart/form-data"><input id="editingId" type="hidden"><div class="row g-3 mt-1"><div class="col-lg-7"><label class="form-label fw-semibold">Book title</label><input name="title" class="form-control" maxlength="120" required></div><div class="col-lg-5"><label class="form-label fw-semibold">Price (₹)</label><input name="price" type="number" min="0" max="100000" step="0.01" class="form-control" required></div><div class="col-12"><label class="form-label fw-semibold">Description</label><textarea name="description" rows="3" maxlength="1200" class="form-control" required></textarea></div><div class="col-md-6"><div class="drop h-100"><label class="form-label fw-semibold">Ebook PDF</label><input name="ebook" type="file" accept="application/pdf" class="form-control"><small id="pdfHelp" class="text-secondary">Required for a new book · max 50 MB</small></div></div><div class="col-md-6"><div class="drop h-100"><label class="form-label fw-semibold">Cover image</label><input name="cover" type="file" accept="image/png,image/jpeg,image/webp" class="form-control"><small class="text-secondary">JPG, PNG, or WebP · portrait works best</small></div></div><div class="col-12"><label class="form-label fw-semibold">Highlights <span class="text-secondary fw-normal">(one per line)</span></label><textarea name="features" rows="4" class="form-control" placeholder="What readers will learn&#10;Who this book is for"></textarea></div><div class="col-12 d-flex gap-2"><button id="save" class="btn btn-brand rounded-pill px-4" type="submit">Publish ebook</button><button id="cancel" class="btn btn-outline-secondary rounded-pill px-4" type="button">Cancel</button></div></div></form></section><section class="panel overflow-hidden"><div class="table-responsive"><table class="table table-hover table-books align-middle mb-0"><thead><tr><th class="ps-4">Book</th><th>Price</th><th>File</th><th class="text-end pe-4">Actions</th></tr></thead><tbody id="books"><tr><td colspan="4" class="text-center p-5"><span class="spinner-border text-primary"></span></td></tr></tbody></table></div></section></main></div></div>
  <button class="theme-toggle position-fixed top-0 end-0 m-3" style="z-index:1100" data-theme-toggle type="button" aria-label="Use dark mode"></button><script src="/theme.js"></script><script>
    const login=document.getElementById('login'),dashboard=document.getElementById('dashboard'),editor=document.getElementById('editor'),form=document.getElementById('bookForm'),alertEl=document.getElementById('alert');let books=[];
    const descriptionField=form.querySelector('[name="description"]').closest('.col-12');descriptionField.insertAdjacentHTML('beforebegin','<div class="col-md-6"><label class="form-label fw-semibold">Author</label><input name="author" class="form-control" maxlength="120" placeholder="Author name" required></div><div class="col-md-6"><label class="form-label fw-semibold">Category</label><input name="category" class="form-control" maxlength="80" list="categoryOptions" placeholder="e.g. Marketing" required><datalist id="categoryOptions"></datalist></div>');
    const money=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2});
    function esc(v){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}
    async function json(response){const data=await response.json().catch(()=>({}));if(!response.ok)throw Object.assign(new Error(data.error||'Request failed'),{status:response.status});return data}
    function message(text,type='success'){alertEl.innerHTML=`<div class="alert alert-${type}">${esc(text)}</div>`;scrollTo({top:0,behavior:'smooth'})}
    function thumb(book){return /^(https?:\/\/|\/)/.test(book.cover)?`<img class="book-thumb" src="${esc(book.cover)}" alt="">`:`<div class="book-thumb" style="background:${book.cover}"></div>`}
    function render(){const categories=[...new Set(books.map(book=>book.category).filter(Boolean))].sort();document.getElementById('categoryOptions').innerHTML=categories.map(value=>`<option value="${esc(value)}">`).join('');document.getElementById('books').innerHTML=books.length?books.map(book=>`<tr><td class="ps-4"><div class="d-flex align-items-center gap-3">${thumb(book)}<div><div class="fw-bold">${esc(book.title)}</div><small class="text-primary">${esc(book.author||'ReadVault')} · ${esc(book.category||'General')}</small><br><small class="text-secondary">${esc(book.description.slice(0,70))}${book.description.length>70?'…':''}</small></div></div></td><td class="fw-semibold">${money.format(book.price)}</td><td><small>${esc(book.filename)}</small></td><td class="text-end pe-4"><button class="btn btn-sm btn-outline-secondary me-1" data-copy="${esc(book.id)}">Copy link</button><button class="btn btn-sm btn-outline-primary me-1" data-edit="${esc(book.id)}">Edit</button><button class="btn btn-sm btn-outline-danger" data-delete="${esc(book.id)}">Delete</button></td></tr>`).join(''):'<tr><td colspan="4" class="text-center text-secondary p-5">No ebooks yet. Add your first one.</td></tr>'}
    async function load(){try{books=await json(await fetch('/api/admin/books'));login.classList.add('d-none');dashboard.classList.remove('d-none');render()}catch(e){if(e.status===401){dashboard.classList.add('d-none');login.classList.remove('d-none')}else{login.classList.remove('d-none');document.getElementById('loginAlert').innerHTML=`<div class="alert alert-danger">${esc(e.message)}</div>`}}}
    function openEditor(book){form.reset();document.getElementById('editingId').value=book?.id||'';document.getElementById('formTitle').textContent=book?'Edit ebook':'Add a new ebook';document.getElementById('save').textContent=book?'Save changes':'Publish ebook';form.ebook.required=!book;document.getElementById('pdfHelp').textContent=book?'Leave empty to keep the current PDF':'Required for a new book · max 50 MB';if(book){form.title.value=book.title;form.author.value=book.author||'ReadVault';form.category.value=book.category||'General';form.price.value=book.price;form.description.value=book.description;form.features.value=(book.features||[]).join('\n')}editor.classList.remove('d-none');editor.scrollIntoView({behavior:'smooth'})}
    function closeEditor(){editor.classList.add('d-none');form.reset()}
    document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;try{await json(await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})}));document.getElementById('password').value='';await load()}catch(error){document.getElementById('loginAlert').innerHTML=`<div class="alert alert-danger">${esc(error.message)}</div>`}finally{button.disabled=false}});
    form.addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('editingId').value,button=document.getElementById('save');button.disabled=true;button.textContent='Saving…';try{const saved=await json(await fetch(id?`/api/admin/books/${encodeURIComponent(id)}`:'/api/admin/books',{method:id?'PUT':'POST',body:new FormData(form)}));if(id)books=books.map(b=>b.id===id?saved:b);else books.push(saved);render();closeEditor();message(id?'Ebook updated.':'Ebook published to your store.')}catch(error){message(error.message,'danger')}finally{button.disabled=false}});
    document.getElementById('books').addEventListener('click',async e=>{const edit=e.target.dataset.edit,remove=e.target.dataset.delete,copy=e.target.dataset.copy;if(copy){const url=`${location.origin}/books/${encodeURIComponent(copy)}`;try{await navigator.clipboard.writeText(url);message('Book link copied. Paste it into your Meta ad.')}catch{prompt('Copy this book link:',url)}return}if(edit)return openEditor(books.find(b=>b.id===edit));if(remove&&confirm('Delete this ebook and its uploaded files? This cannot be undone.')){try{await json(await fetch(`/api/admin/books/${encodeURIComponent(remove)}`,{method:'DELETE'}));books=books.filter(b=>b.id!==remove);render();message('Ebook deleted.')}catch(error){message(error.message,'danger')}}});
    document.getElementById('newBook').onclick=()=>openEditor();document.getElementById('closeEditor').onclick=closeEditor;document.getElementById('cancel').onclick=closeEditor;document.getElementById('logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.reload()};load();
  </script>
</body>
</html>
