<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ReadVault — Ebook Library</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--ink:#172033;--muted:#64748b;--brand:#6d4aff;--paper:#f7f8fc}body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}.navbar{background:rgba(255,255,255,.92);backdrop-filter:blur(12px)}.brand-mark{width:32px;height:32px;display:inline-grid;place-items:center;background:var(--brand);color:#fff;border-radius:10px}.hero{padding:7rem 0 5rem;background:radial-gradient(circle at 85% 15%,#ddd6fe 0,transparent 32%),linear-gradient(135deg,#fff,#f1f5ff)}.eyebrow{color:var(--brand);font-weight:700;letter-spacing:.12em;font-size:.78rem}.display-title{font-size:clamp(2.5rem,6vw,5rem);line-height:1.02;letter-spacing:-.055em}.book-card{border:0;border-radius:1.25rem;overflow:hidden;transition:.25s;box-shadow:0 12px 35px rgba(30,41,59,.08)}.book-card:hover{transform:translateY(-6px);box-shadow:0 20px 45px rgba(30,41,59,.14)}.cover{min-height:280px;padding:1.5rem;display:flex;align-items:flex-end;color:white;position:relative}.cover:before{content:'';position:absolute;inset:18px;border:1px solid rgba(255,255,255,.35);border-radius:.7rem}.cover span{font-size:1.55rem;font-weight:800;line-height:1.1;position:relative}.price{font-size:1.25rem;font-weight:800}.btn-brand{background:var(--brand);border-color:var(--brand);color:#fff}.btn-brand:hover{background:#5536db;border-color:#5536db;color:#fff}.skeleton{height:470px;border-radius:1.25rem;background:linear-gradient(90deg,#e7eaf1 25%,#f4f5f8 50%,#e7eaf1 75%);background-size:200% 100%;animation:load 1.2s infinite}@keyframes load{to{background-position:-200% 0}}footer{color:var(--muted)}
  .brand-logo{width:64px;height:42px;object-fit:contain;border-radius:10px;background:#030712;box-shadow:0 3px 12px rgba(30,41,59,.18)}
  .filters{display:flex;gap:.65rem;overflow-x:auto;padding:.15rem 0 1.5rem;scrollbar-width:thin}.filter-btn{white-space:nowrap;border:1px solid #dfe3ec;background:#fff;color:var(--ink);min-height:44px}.filter-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}.book-byline{color:var(--brand);font-size:.83rem;font-weight:650}.category-badge{position:absolute;z-index:1;left:1rem;top:1rem;background:rgba(255,255,255,.94);color:var(--ink);padding:.35rem .7rem;border-radius:999px;font-size:.75rem;font-weight:700}
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top border-bottom"><div class="container py-2"><a class="navbar-brand fw-bold d-flex gap-2 align-items-center" href="/"><img class="brand-logo" src="/logo.png" alt="ReadVault logo"> ReadVault</a><span class="small text-secondary d-none d-sm-inline">Ideas worth keeping.</span></div></nav>
  <header class="hero"><div class="container"><div class="row align-items-center"><div class="col-lg-8"><div class="eyebrow mb-3">CURATED DIGITAL BOOKS</div><h1 class="display-title fw-bold">Learn something<br><span class="text-primary">worth building.</span></h1><p class="lead text-secondary mt-4 col-lg-8">Practical ebooks for creators, developers, and independent thinkers. Buy once and download securely.</p><a href="#library" class="btn btn-brand btn-lg rounded-pill px-4 mt-2">Browse the library</a></div></div></div></header>
  <main class="container py-5" id="library"><div class="d-flex justify-content-between align-items-end mb-4"><div><div class="eyebrow mb-2">THE COLLECTION</div><h2 class="fw-bold mb-0">Pick your next read</h2></div><span id="count" class="text-secondary"></span></div><div id="alert"></div><div id="books" class="row g-4"><div class="col-md-6 col-xl-3"><div class="skeleton"></div></div><div class="col-md-6 col-xl-3"><div class="skeleton"></div></div><div class="col-md-6 col-xl-3"><div class="skeleton"></div></div><div class="col-md-6 col-xl-3"><div class="skeleton"></div></div></div></main>
  <footer class="container py-5 border-top mt-4"><div class="d-flex flex-column flex-sm-row justify-content-between"><span>© 2026 ReadVault</span><span>Secure payments powered by Razorpay</span></div></footer>
  <script>
    const booksEl=document.getElementById('books'),alertEl=document.getElementById('alert');let allBooks=[],activeCategory='All';
    booksEl.insertAdjacentHTML('beforebegin','<div id="filters" class="filters" aria-label="Filter books by category"></div>');
    const money=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
    function escapeHtml(value){const d=document.createElement('div');d.textContent=String(value);return d.innerHTML}
    function hasImage(book){return /^(https?:\/\/|\/)/.test(book.cover)}
    function coverStyle(book){return hasImage(book)?`background-image:url('${encodeURI(book.cover)}');background-size:cover;background-position:center`:`background:${book.cover}`}
    function renderBooks(){const books=activeCategory==='All'?allBooks:allBooks.filter(book=>(book.category||'General')===activeCategory);document.getElementById('count').textContent=`${books.length} ${books.length===1?'ebook':'ebooks'}`;booksEl.innerHTML=books.length?books.map(book=>`<div class="col-md-6 col-xl-3"><article class="card book-card h-100"><div class="cover" style="${coverStyle(book)}"><span class="category-badge">${escapeHtml(book.category||'General')}</span><span>${hasImage(book)?'':escapeHtml(book.title)}</span></div><div class="card-body p-4 d-flex flex-column"><div class="book-byline mb-2">By ${escapeHtml(book.author||'ReadVault')}</div><h3 class="h5 fw-bold">${escapeHtml(book.title)}</h3><p class="text-secondary small flex-grow-1">${escapeHtml(book.description)}</p><div class="d-flex align-items-center justify-content-between mt-3"><span class="price">${money.format(book.price)}</span><a class="btn btn-brand rounded-pill px-3" href="/books/${encodeURIComponent(book.id)}">View Book</a></div></div></article></div>`).join(''):'<div class="col-12 text-center text-secondary py-5">No books in this category yet.</div>'}
    function renderFilters(){const categories=['All',...new Set(allBooks.map(book=>book.category||'General'))];const el=document.getElementById('filters');el.innerHTML=categories.map(category=>`<button class="btn rounded-pill px-3 filter-btn ${category===activeCategory?'active':''}" data-category="${escapeHtml(category)}" aria-pressed="${category===activeCategory}">${escapeHtml(category)}</button>`).join('')}
    document.getElementById('filters').addEventListener('click',event=>{const category=event.target.dataset.category;if(!category)return;activeCategory=category;renderFilters();renderBooks()});
    async function loadBooks(){try{const response=await fetch('/api/books');if(!response.ok)throw new Error('Could not load the library.');allBooks=await response.json();renderFilters();renderBooks()}catch(error){booksEl.innerHTML='';alertEl.innerHTML=`<div class="alert alert-danger">${escapeHtml(error.message)} Please refresh and try again.</div>`}}
    loadBooks();
  </script>
</body>
</html>
